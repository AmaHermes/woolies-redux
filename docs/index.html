<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#00573F" />
<meta name="robots" content="noindex,nofollow" />
<title>Woolies Redux</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: 'Inter', -apple-system, system-ui, sans-serif;
    background: linear-gradient(160deg, #00573F 0%, #003A29 60%, #001A12 100%);
    color: #fff;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: rgba(255,255,255,0.04);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 24px;
    padding: 36px 28px 28px;
    text-align: center;
    box-shadow: 0 30px 80px rgba(0,0,0,0.4);
  }
  .logo {
    width: 64px; height: 64px;
    background: #F7B500;
    color: #003A29;
    border-radius: 50%;
    display: grid; place-items: center;
    font-weight: 800; font-size: 28px;
    margin: 0 auto 18px;
    letter-spacing: -1px;
    box-shadow: 0 8px 20px rgba(247,181,0,0.3);
  }
  h1 {
    font-size: 22px; font-weight: 800; margin: 0 0 4px;
    letter-spacing: -0.4px;
  }
  .tag {
    font-size: 11px; font-weight: 600;
    color: #F7B500;
    text-transform: uppercase; letter-spacing: 1.6px;
    margin-bottom: 22px;
  }
  p {
    font-size: 13.5px; line-height: 1.55;
    color: rgba(255,255,255,0.7);
    margin: 0 0 22px;
  }
  .input-wrap {
    display: flex; gap: 8px;
    margin-bottom: 12px;
  }
  input {
    flex: 1;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    padding: 13px 14px;
    font: inherit; font-size: 15px;
    color: #fff;
    outline: none;
    transition: border-color .15s ease, background .15s ease;
  }
  input:focus {
    border-color: #F7B500;
    background: rgba(255,255,255,0.12);
  }
  input::placeholder { color: rgba(255,255,255,0.4); }
  button {
    background: #F7B500;
    color: #003A29;
    border: none;
    border-radius: 12px;
    padding: 13px 22px;
    font: inherit; font-weight: 700; font-size: 14px;
    cursor: pointer;
    transition: transform .1s ease, background .15s ease;
    letter-spacing: -0.1px;
  }
  button:hover { background: #FFCB2E; }
  button:active { transform: scale(0.96); }
  .err {
    color: #FF9D8A;
    font-size: 12.5px;
    font-weight: 600;
    height: 18px;
    margin-top: 6px;
  }
  .meta {
    font-size: 11px;
    color: rgba(255,255,255,0.4);
    margin-top: 22px;
    line-height: 1.6;
  }
  .meta strong { color: rgba(255,255,255,0.7); font-weight: 600; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">W</div>
  <h1>Woolies Redux</h1>
  <div class="tag">Private Preview</div>
  <p>This is a private design concept, not affiliated with Woolworths. Enter the access code to continue.</p>
  <form id="f">
    <div class="input-wrap">
      <input id="pw" type="password" placeholder="Access code" autocomplete="off" autofocus>
      <button type="submit">Enter</button>
    </div>
    <div class="err" id="err"></div>
  </form>
  <div class="meta">
    <strong>Build status:</strong> active prototype<br>
    Made with care 🧀
  </div>
</div>

<script>
// SHA-256 of the access code. Bypassable via view-source but enough to keep
// search engines, casual visitors, and "let me click this random link" out.
// Real protection (CF Access / Worker auth) lands when we go public.
const HASH = "7cd84c52f1e1b051dfdde96b6e17b2e8f755277d27ed018e9fdc19dd4432ba48";

async function sha256(s) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join('');
}

// If already authed, jump straight in
if (sessionStorage.getItem('wr.auth') === 'ok' || localStorage.getItem('wr.auth') === 'ok') {
  location.replace('./app.html');
}

document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const pw = document.getElementById('pw').value.trim();
  const err = document.getElementById('err');
  err.textContent = '';
  const h = await sha256(pw);
  if (h === HASH) {
    localStorage.setItem('wr.auth', 'ok');
    sessionStorage.setItem('wr.auth', 'ok');
    location.replace('./app.html');
  } else {
    err.textContent = 'Nope. Try again.';
    document.getElementById('pw').value = '';
    document.getElementById('pw').focus();
  }
});
</script>
</body>
</html>
